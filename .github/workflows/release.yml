name: Release Build

# 触发: 推送 v* 标签 或 手动指定版本
# 签名(macOS)仅需 2 个 Secrets (均可空, 空则 ad-hoc):
#   MACOS_CERT_P12_BASE64 / MACOS_CERT_P12_PASSWORD (身份自动从证书提取)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (纯数字, 不带 v 前缀)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: prepare
    runs-on: macos-15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      APP_NAME: MeiCodexHelper
    steps:
      - uses: actions/checkout@v4
      - name: Create tag (手动触发时)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.prepare.outputs.tag }}"
          git push origin "${{ needs.prepare.outputs.tag }}"
      - name: Build app
        run: cd mac && ./build.sh
      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          PWD_: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > /tmp/cert.p12
          KC=/tmp/build.keychain
          security create-keychain -p buildci "$KC" || true
          security default-keychain -s "$KC"
          security unlock-keychain -p buildci "$KC"
          security import /tmp/cert.p12 -k "$KC" -P "$PWD_" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k buildci "$KC"
          for ca in AppleWWDRCAG4 AppleWWDRCAG6; do
            curl -sSL -o /tmp/$ca.cer "https://www.apple.com/certificateauthority/$ca.cer" || true
            security import /tmp/$ca.cer -k "$KC" 2>/dev/null || true
          done
          ID=$(security find-identity -v "$KC" | awk '/Developer ID Application/ && /\)/ {print $2}' | head -1)
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Sign (auto identity or ad-hoc fallback)
        run: |
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            echo "使用身份签名: $SIGN_IDENTITY"
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" "mac/build/$APP_NAME.app"
          else
            echo "未配置证书, 使用 ad-hoc 签名"
            codesign --force -s - --deep "mac/build/$APP_NAME.app"
          fi
          codesign --verify --strict "mac/build/$APP_NAME.app" && echo "签名校验通过"
      - name: Package dmg
        run: |
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "mac/build/$APP_NAME.app" \
            -ov -format UDZO "MeiCodexHelper-${VERSION}-macos.dmg"
          hdiutil verify "MeiCodexHelper-${VERSION}-macos.dmg" >/dev/null && echo "DMG 校验通过"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: MeiCodexHelper-*-macos.dmg

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build (PyInstaller x4)
        shell: powershell
        run: ./windows/build.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows/dist/MeiCodexHelper-*-windows.zip

  release:
    needs: [prepare, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and release
        run: |
          find artifacts -name "*.dmg" -o -name "*.zip" | xargs -I{} cp {} .
          ls -la *.dmg *.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            MeiCodexHelper-*.dmg
            MeiCodexHelper-*.zip
          generate_release_notes: true
