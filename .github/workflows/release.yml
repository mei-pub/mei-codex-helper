name: Release Build

# 触发: 推送 v* 标签 或 手动运行
# 签名仅需 2 个 Secrets (均可空, 空则 ad-hoc 签名):
#   MACOS_CERT_P12_BASE64    — Developer ID 证书 .p12 的 base64
#   MACOS_CERT_P12_PASSWORD  — .p12 导出密码
# 签名身份自动从证书中提取, 无需单独配置
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (纯数字, 如 2.2.0, 不带 v 前缀)"
        required: true
        default: "2.2.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
      APP_NAME: MeiCodexHelper

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version & tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag (手动触发时)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Build app
        run: ./build.sh

      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          PWD_: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > /tmp/cert.p12
          KC=/tmp/build.keychain
          security create-keychain -p buildci "$KC" || true
          security default-keychain -s "$KC"
          security unlock-keychain -p buildci "$KC"
          security import /tmp/cert.p12 -k "$KC" -P "$PWD_" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k buildci "$KC"
          ID=$(security find-identity -v -p codesign "$KC" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Sign (auto identity or ad-hoc fallback)
        run: |
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            echo "使用身份签名: $SIGN_IDENTITY"
            codesign --force --options runtime --timestamp \
              --sign "$SIGN_IDENTITY" "build/$APP_NAME.app"
          else
            echo "未配置证书, 使用 ad-hoc 签名"
            codesign --force -s - --deep "build/$APP_NAME.app"
          fi
          codesign --verify --strict "build/$APP_NAME.app" && echo "签名校验通过"

      - name: Package zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ditto -c -k --keepParent "build/$APP_NAME.app" "MeiCodexHelper-$VERSION.zip"
          echo "ZIP=MeiCodexHelper-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Upload artifact (每次构建都保留)
        uses: actions/upload-artifact@v4
        with:
          name: MeiCodexHelper-app
          path: MeiCodexHelper-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: MeiCodexHelper-*.zip
          generate_release_notes: true
